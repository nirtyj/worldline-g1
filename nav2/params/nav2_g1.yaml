# Nav2 (Jazzy 1.3) parameters for a Unitree G1 walking with NVIDIA GEAR-SONIC (docs/nav2.md).
#
# What the robot can do (SONIC planner through wl-body, body/velocity.py):
#   SLOW_WALK 0.2-0.8 m/s in any direction relative to the facing (holonomic), strafe <= 0.4 m/s, turn in place
#   through IDLE + facing, rotation only through a facing setpoint (no yaw-rate input), ~0.3-0.5 s response lag,
#   planner re-plans on every command change. So: holonomic but slow, gentle accelerations, no spins/back-up bursts.
# Localisation: ground truth (gt.pose -> /odom + TF odom->base_link, static map->odom identity; nav2/ros_bridge.py).
# Map: the RAW house occupancy (/map, latched, from P1 get_occupancy); the inflation layers add the robot radius.
# Sensors: none in M1 -> both costmaps are static + inflation only.
#   TODO(M2 sensors): add an obstacle/voxel layer to the local costmap (and the global one for replanning) fed by the
#   head D435 depth -> PointCloud2 and/or a MID-360 LiDAR -> LaserScan, plus a collision_monitor between the velocity
#   smoother and the bridge. Nothing else here needs to change.
# Frames: map -> odom -> base_link (base_link = pelvis projected on the floor: x, y, yaw).
# All nodes run in one component container (nav2/launch/wl_nav2.launch.py) to keep CPU and DDS traffic low.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 50                 # BT ticks at 20 Hz (default 100 Hz): the controller runs at 20 Hz anyway;
                                         # also 5x fewer NavigateToPose feedback msgs into the Python bridge
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # default_nav_to_pose_bt_xml is set by the launch file (nav2/bt/navigate_humanoid.xml: no Spin / BackUp)
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001      # holonomic: vy counts as motion (default 0.5 is for diff drive)
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    use_realtime_priority: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25     # 0.25 m in 10 s: a humanoid turning in place for a few s is still progress
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.2094         # 12 deg
    # Controller (measured on the fakes, docs/nav2.md "Controller choice"): Regulated Pure Pursuit is the default.
    # SONIC cannot walk slower than 0.2 m/s (SLOW_WALK floor) and reacts with ~0.3-0.5 s lag; MPPI (Omni) keeps
    # asking for 0.05-0.2 m/s near goals and around corners, the body has to round that up to 0.2, and MPPI's model
    # is then wrong: it orbited goals and swung wide at corners (+50% distance, 1.6x time vs RPP on the same 4 goals).
    # RPP never asks for less than 0.2 m/s while moving (min_approach / regulated min speed), turns in place (IDLE +
    # facing on SONIC) when the path turns > 45 deg, and tracks the path within a few cm. MPPI Omni stays available
    # (params/controller_mppi.yaml, `nav2/up.sh --controller mppi`) for when SONIC's strafing is worth using.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.2          # SLOW_WALK floor
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.2
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0
      # vx 0.2-0.5 (SLOW_WALK 0.2-0.8), wz <= 0.6 (rotate to heading), no reversing; accelerations are limited by the
      # velocity smoother below (0.6 m/s^2, 1.2 rad/s^2)

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.30                  # G1 footprint (shoulders / swinging arms), body A* uses 0.25
      transform_tolerance: 0.3
      plugins: ["static_layer", "inflation_layer"]
      # TODO(M2 sensors): "obstacle_layer" (nav2_costmap_2d::ObstacleLayer, LaserScan from a MID-360) or
      # "voxel_layer" (nav2_costmap_2d::VoxelLayer, PointCloud2 from the head D435, which looks ~48 deg down), placed
      # between static_layer and inflation_layer.
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.3
      plugins: ["static_layer", "inflation_layer"]
      # TODO(M2 sensors): obstacle/voxel layer here too so replanning sees new obstacles.
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    # Smac 2D: cost-aware A* on the 5 cm grid (like the body's clearance-weighted A*), 8-connected, smoothed output.
    # cost_travel_multiplier keeps the path centred in doorways; NavFn would hug the inflation edge.
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25                     # goal a little inside the inflated area -> plan to the nearest free cell
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]            # humanoid: no spin / backup / drive_on_heading (nav2/bt/navigate_humanoid.xml)
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.8

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.4, 0.8]
    min_velocity: [-0.2, -0.4, -0.8]
    max_accel: [0.6, 0.5, 1.2]
    max_decel: [-0.8, -0.6, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0
    # node_names is set by the launch file
