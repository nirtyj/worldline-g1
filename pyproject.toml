[project]
name = "worldline-g1"
version = "0.2.0"
description = "Worldline's runtime on a Unitree G1 in Isaac Sim, walking with GEAR-SONIC (PLAN.md)"
requires-python = ">=3.11"
# P5 wl-runtime (py3.11). api/ itself is stdlib only (imported by py3.11 and py3.12 processes).
dependencies = [
    "numpy>=2",
    "scipy",                # world/: csgraph Dijkstra (map edges), body.nav_grid distance transform, perception ndimage
    "pillow",
    "pyzmq",
    "msgpack",
    "websockets",
    "pyyaml",
    "google-genai==2.25.0",
    "typesafe_sdk==0.7.2",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
# Run from the repo root: `.venv-rt/bin/python -m pytest` (every M2a/M2b suite; -m live / -m box are opt-in).
# tests/groot: the GR00T client (groot/); sim_isaac/tests: P1's camera specs, wire math and the fake P1 (no Isaac)
pythonpath = ["."]
testpaths = ["tests/unit", "tests/contract", "tests/kept", "tests/world", "tests/services", "tests/ui", "tests/eval",
             "tests/groot", "sim_isaac/tests"]
markers = [
    "asyncio: an async test, run with asyncio.run by tests/*/conftest.py",
    "live: needs real API keys and network (opt-in: -m live)",
    "box: needs the GPU box and the live stack (opt-in: -m box)",
]
addopts = "-m 'not live and not box'"
