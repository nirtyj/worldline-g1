      ingest(msg); fillControls(); banner();
    } else if (msg.type === "frame") {
      if (S.layout) { V.plan.robotMap(msg.robot_map, false); ingest(msg); }
    } else if (msg.type === "camera") {
      setCamera(msg.which, msg.jpeg);
    } else if (msg.type === "loading") {
      if (msg.meta) { S.meta = msg.meta; }
      $("loading").hidden = false; $("loading").textContent = `Loading ${msg.scene}…`;
    } else if (msg.type === "system1") {
      S.s1 = { status: msg.status, detail: msg.detail };
      if (msg.status === "error") toast("System 1: " + (msg.detail || "error"));
    } else if (msg.type === "memory") {
      V.memory.memory(msg);
      if (S.space === "brain") renderSpace();
    } else if (msg.type === "notice") toast(msg.text);
  }

  // ------------------------------------------------------------------ model calls
  const PURPOSE = { classify: "classify", next_action: "next step", route: "System 1 label", observe: "System 1 notice" };
  function callSummary(c) {
    if (c.status === "pending") return `waiting for the model… ${S.state ? Math.max(0, S.state.t - c.t_start).toFixed(1) : ""} s`;
    if (c.status === "error") return `ERROR ${c.error}`;
    const r = c.response || {};
    if (c.purpose === "route") return r.args ? `${c.input.replace(/^USER: /, "")} → ${r.args.kind} (${Math.round((r.args.confidence || 0) * 100)}%)` : `${c.input.replace(/^USER: /, "")} → no label in time: the planner classifies`;
    if (c.purpose === "observe") { const it = (r.args || {}).items || []; return it.length ? it.map((o) => o.what).join(" · ") : "nothing new"; }
    if (c.purpose === "classify") return `"${lastUtterance(c.input)}" → ${r.args ? r.args.kind : "?"}`;
    return `${r.tool}(${args(r.args)})`;
  }
  function lastUtterance(input) {
    const m = input.match(/LATEST UTTERANCE\n([^\n]*)/);
    return m ? m[1] : "";
  }
  function renderCalls() {
    const list = Object.values(S.calls).filter((c) => c.n > S.callsCleared).sort((a, b) => a.n - b.n);
    $("calls-count").textContent = Object.keys(S.calls).length;
    $("calls-note").innerHTML = `Every time the runtime asks the brain something, it shows up here. Click a row to see the exact text the model received and what it answered.` +
      (S.callsLog ? ` Also saved as plain text in <code>${esc(S.callsLog)}</code>.` : "");
    const box = $("calls-scroll");
    const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    $("calls").innerHTML = list.map((c) => {
      const stale = c.version_end != null && c.version_end !== c.version_start;
      const cls = c.via === "rule" ? "rule" : c.status;
      const x = c.via === "rule" ? "no model call" :
        (c.latency_s != null ? `${c.latency_s.toFixed(1)} s · ${(c.tokens_in || 0).toLocaleString()} in / ${c.tokens_out || 0} out` : "");
      return `<button type="button" class="callrow ${cls}" data-n="${c.n}">
        <span class="n">#${c.n}</span><span class="n">${c.t_start.toFixed(1)} s</span>
        <span class="p">${PURPOSE[c.purpose]} · v${c.version_start}${c.via === "rule" ? '<span class="badge rule">rule</span>' : ""}</span>
        <span class="r">${esc(callSummary(c))}${stale ? '<span class="badge stale">stale on return</span>' : ""}</span>
        <span class="x">${esc(x)}</span></button>`;
    }).join("") || `<div class="empty">No model calls yet. Say something to the robot.</div>`;
    for (const b of $("calls").querySelectorAll(".callrow")) b.addEventListener("click", () => openCall(+b.dataset.n));
    if (stick) box.scrollTop = box.scrollHeight;
  }
  function highlightInput(text) {
    return esc(text).split("\n").map((line) =>
      /^[A-Z]{2,}( [A-Z]+)*( \(.*\))?$/.test(line.trim()) ? `<span class="hd">${line}</span>` :
      line.replace(/(&lt;- not replied to yet|\(late: from an earlier request\)|UNKNOWN \(look first\)|\(unverified\))/g, '<span class="flag">$1</span>')
    ).join("\n");
  }
  function afterAnswer(c) {
    if (c.t_end == null) return [];
    const keep = new Set(["decision", "stale_decision", "held_for_reconcile", "rejected", "started", "say_queued",
                          "classified", "correction", "stop", "reconcile_start"]);
    return S.traceAll.filter((r) => r.t >= c.t_end - 0.01 && r.t <= c.t_end + 0.3 && keep.has(r.type)).slice(0, 5);
  }
  function openCall(n) {
    const c = S.calls[n]; if (!c) return;
    S.openCall = n;
    const stale = c.version_end != null && c.version_end !== c.version_start;
    const title = c.via === "rule" ? `#${c.n} · classified by a rule, no model call` :
      c.via === "system1" ? `#${c.n} · System 1: ${c.purpose === "route" ? "label a message" : "notice what the camera shows"}` :
      `#${c.n} · ${c.purpose === "classify" ? "classify what you said" : "choose the next step"}`;
    $("d-title").textContent = title;
    let h = `<div class="facts">
      <span class="pill">sim ${c.t_start.toFixed(2)} → ${c.t_end != null ? c.t_end.toFixed(2) : "…"} s</span>
      ${c.latency_s != null && c.via !== "rule" ? `<span class="pill">${c.latency_s.toFixed(2)} s wall time</span>` : ""}
      ${c.tokens_in ? `<span class="pill">${c.tokens_in.toLocaleString()} tokens in · ${c.tokens_out} out</span>` : ""}
      <span class="pill v">request v${c.version_start}${stale ? " → v" + c.version_end : ""}</span>
      ${stale ? `<span class="pill paused">stale on return</span>` : ""}
    </div>`;
    if (c.via === "rule") h += `<div class="explain">agent/model.py labels some messages with a simple rule instead of asking the model, which saves a 1–2 s round trip: "stop", "go ahead" while paused, and short answers right after the robot asked a question.</div>`;
    if (stale) h += `<div class="explain">You changed the request while this call was in flight (v${c.version_start} → v${c.version_end}). The runtime checks the version when an answer comes back and throws this one away, because it was decided for the old request. That check is <code>_stale</code> in agent/harness.py.</div>`;
    h += `<div class="sec"><h4>The answer</h4>`;
    if (c.status === "pending") h += `<div class="answer">waiting for the model…</div>`;
    else if (c.status === "error") h += `<div class="answer" style="color:var(--bad)">${esc(c.error)}</div>`;
    else {
      const r = c.response;
      h += `<div class="answer">${esc(r.tool)}(${esc(Object.entries(r.args || {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", "))})</div>`;
      if (r.text) h += `<p>Text the model wrote next to the tool call: “${esc(r.text)}”</p>`;
      h += `<p>${c.purpose === "classify" ? "The model can only answer by calling the classify tool, so the answer is always one of the kinds." : "The model is forced to call exactly one tool. The runtime then checks it against its rules before anything moves."}</p>`;
    }
    h += `</div>`;
    const after = afterAnswer(c);
    if (after.length) {
      h += `<div class="sec"><h4>What the runtime did with it</h4><pre>${after.map((r) => { const f = fmtTrace(r); return `${r.t.toFixed(2)}  ${f ? f[1] : r.type}`; }).map(esc).join("\n")}</pre></div>`;
    }
    h += `<div class="sec"><h4>Input: the text the runtime built for this call</h4>
      <p>${c.via === "rule" ? "Only the utterance text was examined." : "The runtime renders its BrainInput (map, conversation, belief, recent actions, what's running, any NOTE) into this text on every call. Apart from the system prompt below, this is everything the model knows. It never sees the simulator's ground truth."}</p>
      <pre>${highlightInput(c.input)}</pre></div>`;
    if (c.system) h += `<div class="sec"><details><summary>System prompt (the same on every ${c.purpose === "classify" ? "classify" : "next-step"} call)</summary><pre>${esc(c.system)}</pre></details></div>`;
    if (c.tool_schemas && c.tool_schemas.length) h += `<div class="sec"><details><summary>Tools offered: ${esc(c.tools.join(", "))}</summary><pre>${esc(JSON.stringify(c.tool_schemas, null, 2))}</pre></details></div>`;
    $("d-body").innerHTML = h;
    $("drawer").hidden = false; $("d-body").scrollTop = 0;
  }
  function closeDrawer() { $("drawer").hidden = true; S.openCall = null; }
  function callAsText(c) {
    const r = c.response || {};
    return [`#${c.n} ${c.purpose}${c.via === "rule" ? " (by rule)" : ""}  sim ${c.t_start}->${c.t_end} s  request v${c.version_start}${c.version_end !== c.version_start ? " -> v" + c.version_end : ""}`,
      "---- SYSTEM PROMPT", c.system || "(none)", "---- INPUT", c.input, "---- TOOLS OFFERED: " + (c.tools || []).join(", "),
      "---- RESPONSE", c.error ? "ERROR " + c.error : `${r.tool}(${JSON.stringify(r.args || {})})${r.text ? "\ntext: " + r.text : ""}`].join("\n");
  }

  // ------------------------------------------------------------------ map zoom and pan
  function applyVB() {
    const svg = $("map");
    svg.setAttribute("viewBox", `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
    const box = svg.getBoundingClientRect();
    const scale = box.width > 0 && box.height > 0 ? Math.max(VB.w / box.width, VB.h / box.height) : 1;
    for (const id of ["human-marker", "robot-marker", "robot-label-marker"]) {
      const marker = $(id);
      if (marker) marker.setAttribute("transform", `scale(${scale})`);
    }
  }
  function toSvg(cx, cy) { const svg = $("map"), pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
  function zoomAt(x, y, f) {
    const w = Math.min(Math.max(VB.w * f, 80), 1000), k = w / VB.w;
    VB = { x: x - (x - VB.x) * k, y: y - (y - VB.y) * k, w, h: VB.h * k };
    S.fitted = false;
    applyVB();
  }
  // The house as big as the pane allows: its rooms, spots and you, padded, stretched to the pane's shape.
  function fitHouse() {
    const box = $("map").getBoundingClientRect(), lay = S.layout, pts = [];
    S.fitted = true;
    if (lay) {
      for (const r of Object.values(lay.rooms || {})) for (const [x, z] of r.polygon || []) pts.push(uv(x, z));
      for (const k of Object.values(lay.keypoints || {})) pts.push(uv(k.x, k.z));
      if (lay.human) pts.push(uv(lay.human.x, lay.human.z));
    }
    if (!pts.length || !box.width || !box.height) { VB = { ...FULL }; applyVB(); return; }
    const pad = 28, xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    let x = Math.min(...xs) - pad, y = Math.min(...ys) - pad - 30, w = Math.max(...xs) + pad - x, h = Math.max(...ys) + pad - y;
    const ar = box.width / box.height;
    if (w / h < ar) { const nw = h * ar; x -= (nw - w) / 2; w = nw; } else { const nh = w / ar; y -= (nh - h) / 2; h = nh; }
    const inside = (v, len, max) => (len <= max ? Math.min(Math.max(v, 0), max - len) : (max - len) / 2);   // no dark strip past the render
    VB = { x: inside(x, w, FULL.w), y: inside(y, h, FULL.h), w, h };
    applyVB();
  }
  const refit = () => (S.fitted ? fitHouse() : applyVB());
  function zoomCenter(f) { zoomAt(VB.x + VB.w / 2, VB.y + VB.h / 2, f); }
  (() => {
    const svg = $("map");
    svg.addEventListener("wheel", (e) => { e.preventDefault(); const p = toSvg(e.clientX, e.clientY); zoomAt(p.x, p.y, Math.exp(e.deltaY * 0.0015)); }, { passive: false });
    let drag = null;
    svg.addEventListener("pointerdown", (e) => { drag = { cx: e.clientX, cy: e.clientY, vb: { ...VB }, a: svg.getScreenCTM().a }; svg.setPointerCapture(e.pointerId); svg.classList.add("dragging"); });
    svg.addEventListener("pointermove", (e) => {
      if (!drag) return;
      if (S.follow) { S.follow = false; $("chk-follow").checked = false; }
      VB.x = drag.vb.x - (e.clientX - drag.cx) / drag.a; VB.y = drag.vb.y - (e.clientY - drag.cy) / drag.a; S.fitted = false; applyVB();
    });
    const end = () => { drag = null; svg.classList.remove("dragging"); };
    svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  })();

  // ------------------------------------------------------------------ feed pane: tabs, clear
  function setTab(tab) {
    S.tab = tab;
    $("tab-feed").setAttribute("aria-selected", String(tab === "feed"));
    $("tab-calls").setAttribute("aria-selected", String(tab === "calls"));
    $("feed-scroll").hidden = tab !== "feed"; $("calls-scroll").hidden = tab !== "calls";
    $("filters").hidden = tab !== "feed";
    if (tab === "calls") renderCalls();
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    S.ws = ws;
    ws.onmessage = onMessage;
    ws.onopen = () => {
      banner();
      setTimeout(() => { if (!S.layout && ws.readyState === 1) ws.send(JSON.stringify({ type: "hello" })); }, 2500);
    };
    ws.onclose = () => {
      $("banner-slot").innerHTML = `<div class="banner">Lost the connection to the server. Retrying… (is <code>python ui/server.py</code> still running?)</div>`;
      setTimeout(connect, 2000);
    };
  }
  $("sel-persona").addEventListener("change", (e) => {
    e.target.classList.toggle("on", e.target.value !== "off");
    wsSend({ type: "persona", level: e.target.value });
  });

  function send(text) {
    text = (text || "").trim();
    if (!text || !S.ws || S.ws.readyState !== 1) return;
    S.ws.send(JSON.stringify({ type: "say", text }));
  }

  $("say-form").addEventListener("submit", (e) => { e.preventDefault(); send($("msg").value); $("msg").value = ""; $("msg").focus(); });
  $("btn-stop").addEventListener("click", () => send("stop"));
  $("btn-forget").addEventListener("click", () => {
    if (!S.ws || S.ws.readyState !== 1) return;
    S.ws.send(JSON.stringify({ type: "reset", forget: true, scene: $("sel-scene").value, model: $("sel-model").value }));
  });
  $("btn-reset").addEventListener("click", () => {
    if (!S.ws || S.ws.readyState !== 1) return;
    S.ws.send(JSON.stringify({ type: "reset", scene: $("sel-scene").value, model: $("sel-model").value }));
  });
  $("sel-scene").addEventListener("change", () => { if (S.meta) renderWorldCard($("sel-scene").value); });
  window.addEventListener("resize", refit);
  $("chk-belief").addEventListener("change", (e) => { S.showBelief = e.target.checked; drawDynamic(); });
  $("z-in").addEventListener("click", () => zoomCenter(0.7));
  $("z-out").addEventListener("click", () => zoomCenter(1 / 0.7));
  $("z-fit").addEventListener("click", () => { S.follow = false; $("chk-follow").checked = false; fitHouse(); });
  $("chk-follow").addEventListener("change", (e) => { S.follow = e.target.checked; if (S.follow) { S.fitted = false; if (VB.w > 400) zoomCenter(0.5); } drawDynamic(); });
  $("tab-feed").addEventListener("click", () => setTab("feed"));
  $("tab-calls").addEventListener("click", () => setTab("calls"));
  $("chk-progress").addEventListener("change", (e) => $("chat").classList.toggle("hide-progress", !e.target.checked));
  $("btn-clear-chat").addEventListener("click", () => { $("chat").innerHTML = ""; S.chatByUid = {}; S.lastRobotMsg = {}; });
  $("btn-clear-bottom").addEventListener("click", () => {
    if (S.tab === "feed") $("feed").innerHTML = "";
    else { S.callsCleared = Math.max(0, ...Object.keys(S.calls).map(Number)); renderCalls(); }
  });
  $("d-close").addEventListener("click", closeDrawer);
  // How it works: a static picture of the system, full screen
  function showHow(on) {
    $("howto").hidden = !on;
    if (on) V.diagram.render($("diagram"), { planner: ((S.meta && S.meta.models) || []).find(([v]) => S.config && v === S.config.model), system1: S.s1 });
  }
  $("btn-how").addEventListener("click", () => showHow($("howto").hidden));
  $("how-close").addEventListener("click", () => showHow(false));
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("howto").hidden) showHow(false); else closeDrawer();
  });
  $("d-copy").addEventListener("click", async () => {
    const c = S.calls[S.openCall]; if (!c) return;
    try { await navigator.clipboard.writeText(callAsText(c)); toast("Copied"); } catch { toast("Copy failed; select the text instead"); }
  });
  for (const cb of $("filters").querySelectorAll("input")) {
    cb.addEventListener("change", () => $("feed").classList.toggle("hide-" + cb.dataset.src, !cb.checked));
  }
  // workspaces and step mode
  V.plan.mount($("plan-box"));
  V.memory.mount($("mem-box"), $("proc-graph"), $("proc-guide"));
  for (const b of document.querySelectorAll(".wstabs [data-go]")) b.addEventListener("click", () => setSpace(b.dataset.go));
  $("rtabs").addEventListener("click", (e) => { const b = e.target.closest("[data-rtab]"); if (b) setRtab(b.dataset.rtab); });
  $("chk-step").addEventListener("change", (e) => wsSend({ type: "step", mode: e.target.checked ? "on" : "off" }));
  $("btn-step").addEventListener("click", () => wsSend({ type: "step", mode: "next" }));
  $("now").addEventListener("click", (e) => { if (e.target.closest("[data-act=step]")) wsSend({ type: "step", mode: "next" }); });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    const go = { "1": "world", "2": "brain" }[e.key];
    if (go) { e.preventDefault(); setSpace(go); }
    if (e.key === "h" || e.key === "H") showHow($("howto").hidden);
    if (e.key === "n" || e.key === "N") { const st = S.state && S.state.runtime && S.state.runtime.step; if (st && st.waiting) wsSend({ type: "step", mode: "next" }); }
  });
  let saved = {};
  try { saved = { space: localStorage.getItem("worldline.space"), rtab: localStorage.getItem("worldline.rtab") }; } catch { /* private window: fine */ }
  setRtab(["now", "state", "memory", "proc"].includes(saved.rtab) ? saved.rtab : "now");
  setSpace(saved.space === "brain" ? "brain" : "world");
  connect();
})();
</script>
</body>
</html>
