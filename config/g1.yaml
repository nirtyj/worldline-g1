# Unitree G1 constants for the runtime side: workspace (reachability), walking (navigation timeouts and the lite
# body), cameras (GT perception), map generation and scans. Initial values; M3.5 calibrates the workspace with
# tools/calibrate_workspace.py (IK sampling) and S1.9 measures arrival/reposition accuracy (PLAN §6.4, §11).
robot: unitree_g1

workspace:                      # PLAN §6.4 G1Workspace (object positions in the CURRENT pelvis frame): the G1's arm, R.7 /
                                # M3.5 calibration (docs/calibration.md): world/workspace_cal.py samples body/arm_script.py's
                                # own IK (grasp + pregrasp, wrist pitch/yaw locked) and fits a sphere (rms 4 mm);
                                # world/live_cal.py measured the pelvis height and checked the palm live
  shoulder_z_m: 1.083           # reach-sphere centre above the floor: standing pelvis 0.784 (live, n=24) + 0.299 (IK fit)
  shoulder_lat_m: 0.136         # ... 0.136 m out on the reaching arm's side (shoulder pitch + roll joint offsets)
  shoulder_fwd_m: 0.0           # ... fit 0.004 m forward
  arm_reach_m: 0.405            # reach-sphere radius: the IK boundary 0.4255 minus 2 cm (live: the only 2 IK misses of 24
                                # grasps were on the boundary itself)
  grasp_above_top_m: 0.03       # sonic_arm_script's grasp point = the object's AABB top centre + this (B.7 top grasp)
  obj_z_min_m: 0.70             # object centre below this -> too_low (grasp point < ~0.78 m: the palm reaches <= 0.30 m
                                # ahead there, IK envelope; squat mode deferred)
  obj_z_max_m: 1.25             # above this -> too_high (grasp point > ~1.33 m: <= 0.34 m ahead)
  approach_max_m: 0.60          # the largest navigate(reach_stance): the body approach's max_dist (live: 0.53-0.55 m
                                # repositions 3/4, 0.1-0.3 m 15/15)
  reach_fwd_m: [0.15, 0.43]     # grasp point forward of the pelvis: in front of the torso .. the sphere's best reach
  reach_lat_max_m: 0.40
  either_deadband_m: 0.10       # |lateral| below this -> preferred_arm "either"
  stance_fwd_m: [0.22, 0.36]    # the comfortable band a reach stance aims the object at (forward of the pelvis)
  stance_lat_m: [0.0, 0.05, -0.05, 0.10, -0.10, 0.15, -0.15, 0.20, -0.20]
  stance_clearance_m: 0.20      # reach stance: pelvis to the nearest obstacle, raw occupancy (toes 0.13 m ahead of the
                                # pelvis; R.7 live: the body stood 0.15-0.20 m from a counter in 15/15 approaches, no fall)
  stance_via: approach          # reach_stance is the body's `approach` (B.6): a straight segment, not A*'s free space.
                                # services/navigation.py checks it with the approach op's own map rule (0.12 m goal,
                                # 0.05 m segment), which these stances (0.20 m goal, 0.15 m segment) always satisfy
  stance_margin_m: 0.02         # stances keep this much inside arm_reach_m (arrival error)
  far_search: true              # no stance within approach_max_m reaches it: search the supporting furniture's whole
                                # outline (services/reachability.py find_far_stance), shortest walk;
                                # navigate(reach_stance) walks there (A* go_to to `via`, then the approach).
                                # false: too_far + a stand of the same furniture (M2a)
  far_stand_off_m: [0.20, 0.45] # far stance: pelvis this far out from an edge. From stance_clearance_m (the approach's
                                # own rule, R.7), not mapgen's 0.27: H40's bottle_1 is reachable only from 0.20-0.22 m
                                # (the table's -y end, between a chair and the table corner)
  far_step_m: 0.05              # candidates every 5 cm along each edge and across the stand-off band
  far_turn_max_deg: 45.0        # facing the edge normal, turned up to this toward a reach across a corner
  far_walk_max_m: 25.0
  far_staging_max_m: 0.45       # the A* go_to target at most this far from the stance (the approach op takes <= 0.6 m)
  max_held: 1                   # one object at a time (Worldline rule; two hands, one object)
  reach_fresh_s: 30.0
  lite_world:                   # INTERIM: a LiteWorld (the `lite` profile, the laptop test stacks) keeps M2a's optimistic
                                # arm until the tests that pick H38's bed alarm clock (0.62 m: below the calibrated band,
                                # grasp point 0.69 m where the palm reaches 0.18 m ahead) move to an object the G1 can
                                # reach; then this block goes (services/reachability.py G1Workspace.for_world)
    shoulder_z_m: 1.08
    shoulder_lat_m: 0.10
    shoulder_fwd_m: 0.0
    arm_reach_m: 0.65
    grasp_ref: centre
    obj_z_min_m: 0.55
    obj_z_max_m: 1.20
    approach_max_m: 0.40
    reach_fwd_m: [0.20, 0.55]
    stance_fwd_m: [0.30, 0.45]
    stance_lat_m: [0.0, 0.05, -0.05, 0.10, -0.10, 0.15, -0.15]
    stance_clearance_m: 0.25
    stance_via: go_to
    stance_search: band
    far_search: false           # M2a's too_far + a stand of the same furniture (no outline-wide search on lite)

walking:
  cruise_mps: 0.45              # go_to's commanded speed (navigate). R.7 live: a straight SLOW_WALK runs faster than
                                # commanded (0.45 -> 0.57 m/s steady), a whole navigate slower (0.29 m/s, below)
  nav_speed_mps: 0.29           # effective navigate speed incl. the turn at the start, stops and the final approach: R.7
                                # live, go_to legs between H40 keypoints at 0.45 m/s: 17 legs that passed the timing gate
                                # 97.6 m in 335.8 s = 0.291 m/s (all 24 legs 0.297). The bridge sets it from
                                # api.types.PROFILES (walk_speed_mps) for the timeouts and the prompt
  arrive_tol_m: 0.30            # "at a keypoint" radius (PLAN §5.6); R.7 live go_to arrival error 0.11 m mean, 0.18 p90
  final_pos_tol_m: 0.25         # body go_to success bar (contract m1.md §3.4)
  final_yaw_tol_deg: 12.0
  reposition_mps: 0.20
  reposition_tol_m: 0.10        # interim: body go_to has no 5 cm approach op yet (PLAN 0.05; M2b `approach`)
  reposition_tol_deg: 8.0
  reposition_timeout_s: 12.0
  timeout_k: 1.8                # navigate timeout = clamp(k * path_m / v + base, min, max)
  timeout_base_s: 12.0
  timeout_min_s: 20.0
  timeout_max_s: 240.0
  cancel_settle_s: 1.5          # PathFollower IDLE settle bound (PLAN §5.6); R.7 live stop 0.89 s mean (0.77-1.10, n=6)
  # lite body only (kinematic stand-in)
  lite_turn_dps: 45.0
  lite_stop_s: 0.6
  measured:                     # R.7 on SONIC, docs/calibration.md (dev box, H40, 2 sessions, 6 runs). Not read by code
    walk_cmd_to_steady_mps: [[0.30, 0.40], [0.45, 0.57], [0.60, 0.71]]   # SLOW_WALK commanded -> GT steady speed
    walk_start_latency_s: [0.17, 0.30]
    stop_to_rest_s: 0.89        # `stop` 3 s into a 0.45 m/s walk -> |v| < 0.05 (GT); glide 0.21 m
    turn_dps: [[90, 17.8], [180, 25.7]]                                  # turn_to +-90 / 180 deg, final error 0.7-2.7 deg
    navigate_mps: 0.29
    approach_s: [15.1, 22.2]    # mean, p90 over 15 approaches of 0.1-0.3 m (all within 5 cm); 0.53-0.55 m: 3 of 4

scan:
  executor: turn_in_place       # INTERIM (M2a): in-place turn_to steps; M2b: waist_scan via upper_body_position
  yaws_deg: [-35.0, 0.0, 35.0]
  settle_s: 0.4
  turn_tol_deg: 6.0
  min_interval_s: 5.0           # wait_and_observe scans only if the last scan here is older (PLAN §5.1)

manipulation:
  pick_phases_s: {pregrasp: 1.2, grasp: 1.2, lift: 1.0}
  place_phases_s: {lower: 1.2, release: 0.8, retract: 1.0}
  stance_drift_m: 0.05          # pose moved more than this since the reachability -> failed(base_moving)
  stance_drift_deg: 5.0
  verify_hold_s: 0.3

cameras:                        # GT perception camera models (world/perception.py)
  ego_d435:                     # what P1 renders today (contract m1.md §1.4): d435_link on torso_link
    width: 640
    height: 480
    vfov_deg: 45.0
    mount_xyz: [0.0576235, 0.01753, 0.41987]
    mount_pitch_rad: 0.8307767239493009
    range_objects: 2.5
    range_landmarks: 4.0
  head_sim:                     # PLAN §1.3 #7: sim-added head camera, ~1.36 m, 15 deg down, 90 deg HFOV; P1 renders it
    width: 640                  # as `head` on 5565 (docs/contracts/p1_m2b.md §5.1)
    height: 480
    vfov_deg: 73.74
    mount_xyz: [0.06, 0.0, 0.526]
    mount_pitch_deg: 15.0
    range_objects: 2.5
    range_landmarks: 4.0
    sim_added: true
  ego_view:                     # OD1: GR00T's camera = Arena's G1 head camera (p1_m2b.md §5.1), P1 5566 while enabled
    width: 640
    height: 480
    vfov_deg: 55.2978           # f 15 mm on a 15.71625 mm v-aperture (HFOV 69.87)
    mount_xyz: [0.0488135, 0.0, 0.30925]
    mount_pitch_deg: 35.0
    near: 0.1
    range_objects: 2.5
    range_landmarks: 4.0

sim_health:                     # world/sim_health.py (PLAN §3.5; R.6): used when P1 sends no level of its own
  degraded_below: 0.95          # -> manipulate rejected at CAPABILITY
  unsafe_below: 0.85            # -> every body tool rejected at CAPABILITY
  degraded_hold_s: 5.0
  unsafe_hold_s: 3.0
  recover_s: 2.0
  stale_s: 3.0

mapgen:                         # world/mapgen.py MapParams (PLAN §7.1 table)
  segment_m: 1.0
  stand_off_m: [0.27, 0.45]     # PLAN: 0.45-0.60. R.7: the arm reaches 0.37-0.41 m ahead at counter height, and place
                                # never repositions: from 0.27 m a spot 6 cm past the edge is in reach (0.35: none is)
  stand_off_relaxed_m: 1.0
  stand_min_sep_m: 0.5
  stand_clearance_m: 0.25      # A* go_to goal: outside the body's 0.25 m inflation (keypoints are go_to goals)
  robot_radius: 0.25
  nav_speed_mps: 0.29           # R.7 measured navigate speed (the bridge overrides it from the profile)
  max_reach_height_m: 1.20
  min_reach_height_m: 0.55
  user_surface_rule: placeable  # THOR's nearest-to-start rule among surfaces a G1 can place on from the stand
  free_sides: true              # free-standing tables / islands (both long sides free at stand_off_m with clearance):
                                # a stand on EVERY free side, new letters after the existing ones (existing stands
                                # unchanged); wall runs keep one stand per stretch. false: one stand per stretch
  lite_world:                   # INTERIM: a LiteWorld keeps M2a's stands, with its M2a arm (workspace.lite_world); the
                                # Isaac worlds build the R.7 stands above (world/mapgen.py MapParams.for_source)
    stand_off_m: [0.35, 0.50]
    stand_clearance_m: 0.30
