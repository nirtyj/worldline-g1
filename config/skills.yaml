# Skill registry (PLAN §6.4 table). Loaded at session start by services/skills.py; the object_type tool enum is the
# union of object_types over the skills whose backend the profile selects (api/skills.py BACKEND_ORDER), frozen for
# the session. "@vocab:pickupable" expands the FIXED vocabulary (config/vocab/pickupable_types.yaml), never scene GT.
version: 1
skills:
  # GR00T (backend groot -> executor groot_arms, services/executors/groot_arms.py). The off-the-shelf Arena N1.7 G1
  # checkpoint: arm + Dex3 joint chunks through the body `arm` op, SONIC keeps the legs (owner decision (b)). Trained
  # on ONE scene (apple to plate, left hand; 8/37 = 22 % in its own scene, docs/arena_vs_sonic.md §2.1), so every entry
  # is label `experimental` and a house grasp is not expected zero-shot (PLAN §0.8). PolicyServer: scripts/groot_server.sh
  # (docs/groot_serving.md).
  # `stance` (W2.5, docs/groot_serving.md §8): Arena's frames show the apple in the lower part of the head camera, left
  # of centre. With P1's ego_view (Arena's camera: 1.14 m, 35 deg down) a low object sits below the image's upper third
  # on the 0.78 m table, the 0.94 m counter and the 0.97 m dresser of H40 when it is 0.30 m ahead of the pelvis and
  # 0.10 m to the left (pinhole model: v = 381 / 215 / 173 of 480, u = 205 / 167 / 158); farther or more lateral fails
  # on the counter or the dresser (groot/stance.py; a table grasp point at 0.30 m also stays inside the R.7 reach
  # sphere world-cal is calibrating, 0.35 m does not). COMPUTED from the camera model;
  # the live probe (tools/groot_stance_probe.py) has not run yet (both boxes stopped, 2026-09-29 11:47Z): INTERIM.
  # A stance pins the object: check_reachability then needs a free spot 0.30 m from it (with stance_clearance_m to the
  # furniture), so the object must lie within ~0.10 m of the front edge, and today a skill's stance is strict (no
  # fallback to the next candidate's window). So only the apple skill (the checkpoint's own object, OD4) carries it;
  # on the `any` skill it would make every deeper pickable unreachable in `full` before groot_then_script can fall back
  # (request to world: use a GR00T stance when a free spot satisfies it, else the next healthy candidate's window).
  # tol_deg 25: services/reachability.py in_window compares the heading with the bearing to the object, which is
  # atan2(0.10, 0.30) = 18.4 deg off at this stance by construction (request to world: compare with bearing -
  # atan2(lateral_m, stand_off_m) - yaw_to_object).
  - skill_id: groot.pick.apple.arena_static_experimental.v0
    action: pick
    object_types: [apple]
    arms: [left]                 # the checkpoint's hand (right-hand action std 0.018 vs left 0.598, design §2.7)
    backend: groot
    label: experimental
    status: available
    embodiment_tag: new_embodiment
    checkpoint: nvidia/GN1x-Tuned-Arena-G1-Static-PickNPlace@7f78bebf1a90131e7304beacfcd47eb27bad16ab
    policy_port: 5550
    policy_endpoint: tcp://127.0.0.1:5550
    # groot.obs.DEFAULT_PROMPT (a test pins it): the released dataset's own tasks.jsonl sentence for this task. Open loop
    # it reproduced the demos' arm motion better than Arena's eval string "move the apple to the plate" in 3 of 3 runs
    # (docs/groot_serving.md §6.2.1); the closed-loop comparison is G2
    prompt_template: "Pick up the apple from the shelf and place it onto the plate on the same shelf next to it."
    hand_type: dex3
    action_horizon: 40
    control_hz: 50.0
    replan_hz: 2.5
    stance: {stand_off_m: 0.30, lateral_m: 0.10, yaw_to_object: 0.0, tol: [0.05, 25.0]}   # W2.5, INTERIM (above)
    max_duration_s: 25.0
    success: {kind: gt_lifted, min_lift_m: 0.05, max_dist_m: 0.12, hold_s: 1.0}
    licence: "NVIDIA Open Model License Agreement; the model card says non-commercial use only (OD2)"

  - skill_id: groot.pick.any.arena_static_experimental.v0
    action: pick
    object_types: ["@vocab:pickupable"]
    arms: [left]
    backend: groot
    label: experimental
    status: available
    embodiment_tag: new_embodiment
    checkpoint: nvidia/GN1x-Tuned-Arena-G1-Static-PickNPlace@7f78bebf1a90131e7304beacfcd47eb27bad16ab
    policy_port: 5550
    policy_endpoint: tcp://127.0.0.1:5550
    # the trained sentence (groot.obs.DEFAULT_PROMPT) with the object swapped in (untrained)
    prompt_template: "Pick up the {label} from the shelf and place it onto the plate on the same shelf next to it."
    hand_type: dex3
    action_horizon: 40
    control_hz: 50.0
    replan_hz: 2.5
    max_duration_s: 25.0
    success: {kind: gt_lifted, min_lift_m: 0.05, max_dist_m: 0.12, hold_s: 1.0}
    licence: "NVIDIA Open Model License Agreement; the model card says non-commercial use only (OD2)"

  - skill_id: groot.pick.household.isaac.v1
    action: pick
    object_types: [alarm_clock, apple, mug]
    arms: [left, right]
    backend: groot
    label: target
    status: planned              # deferred (PLAN §0.8): fine-tuned on scripted Isaac Dex3 demos (design §3-§4)
    embodiment_tag: new_embodiment
    policy_port: 5552
    prompt_template: "pick up the {label} with the {arm} hand"
    max_duration_s: 25.0

  - skill_id: groot.pick.bottle.cloudwalk.v0
    action: pick
    object_types: [bottle]
    arms: [right]
    backend: groot
    label: experimental
    status: planned              # RETIRED with groot_sonic: a SONIC-token checkpoint (UNITREE_G1_SONIC, Inspire hands);
                                 # groot_arms serves joint-space new_embodiment checkpoints only
    embodiment_tag: UNITREE_G1_SONIC
    checkpoint: cloudwalk-research/gr00t-n17-g1-grab-bottle-rh-210ep-v2-finetune/checkpoint-20000
    policy_port: 5550
    prompt_template: "grab the bottle"
    hand_type: inspire
    max_duration_s: 25.0
    licence: "NVIDIA Open Model License (GR00T N1.7 base); community fine-tune"

  - skill_id: sonic.script.pick.v0
    action: pick
    object_types: ["@vocab:pickupable"]
    arms: [left, right]
    backend: sonic_arm_script
    label: stepping_stone        # SONIC reaches with planner-mode upper-body targets, then a GT attach (M3)
    max_duration_s: 12.0

  - skill_id: sonic.script.place.v0
    action: place
    object_types: ["@vocab:pickupable"]
    arms: [left, right]
    backend: sonic_arm_script
    label: stepping_stone
    max_duration_s: 10.0

  - skill_id: bringup.attach.pick.v0
    action: pick
    object_types: ["@vocab:pickupable"]
    arms: [left, right]
    backend: kinematic_attach
    label: stepping_stone        # kinematic attach grasp: the object is attached to the hand, no arm motion
    max_duration_s: 8.0

  - skill_id: bringup.attach.place.v0
    action: place
    object_types: ["@vocab:pickupable"]
    arms: [left, right]
    backend: kinematic_attach
    label: stepping_stone
    max_duration_s: 8.0

  - skill_id: lite.pick.v0
    action: pick
    object_types: ["@vocab:pickupable"]
    arms: [left, right]
    backend: lite
    label: stepping_stone        # the lite profile: pure Python, everything physical is simulated
    max_duration_s: 8.0

  - skill_id: lite.place.v0
    action: place
    object_types: ["@vocab:pickupable"]
    arms: [left, right]
    backend: lite
    label: stepping_stone
    max_duration_s: 8.0
