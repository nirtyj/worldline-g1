# The Worldline-on-G1 demo: the steps, in order. ONE list, read by both runners (docs/demo.md):
#   scripts/demo.sh            on the box, through tools/say.py (python -m tools.demo_steps bash | results)
#   the Worldline UI's Demo panel (ui/demo.py), through the chat's own say path
# Both send the lines the same way and judge each step with the same PASS rule (tools/demo_steps.py RULES).
#
# A step:
#   id          the number scripts/demo.sh --only takes
#   title       a few words (demo.sh's "behaviour" column)
#   shows       one line: what the step demonstrates
#   lines       what is said, in order. A plain line waits until the robot has been idle for `idle_s` (twice that
#               if nothing happened yet) or `max_s`; "@N text" is sent N s after the previous line instead (no wait).
#   max_s       give up waiting on one line after this long (the step goes on; the evidence says so)
#   if_asked    [[RE, REPLY], ...]: when the robot says something matching RE (case-insensitive), say REPLY once
#   needs       optional: what the step needs from the start state (the runners warn when it does not hold)
#   pass        the PASS rule: {rule: <name>, ...its parameters}; tools/demo_steps.py RULES has each rule
#   pass_text   the rule in words (docs/demo.md, the Demo panel)
#
# Rules (a step's rows = the trace from its first line on):
#   note_saved                         a note_saved row
#   answered_while_walking location, line
#                                      navigate succeeded to a location containing `location`, and speech that
#                                      started after line N (1-based, as heard) and no later than the arrival
#   stop_resume location               a stop that was not already paused, a resume after it, then navigate
#                                      succeeded to `location` after the resume
#   said pattern                       speech matching the regex `pattern` (case-insensitive)
#   nav_after_line location, line      navigate succeeded to `location` after line N was heard
#   reach_refusal verdict              a check_reachability result whose summary has `verdict`, and speech from
#                                      0.5 s before it on
#   pick_holding                       a manipulate pick succeeded with data.holding
defaults:
  idle_s: 5                 # tools.say --idle-s
  idle_ignores_wait: true   # tools.say --idle-ignores-wait: a running wait_and_observe does not count as busy
  ready_s: 240              # before the first step: wait this long for System 1 ready and an idle runtime
  between_s: 2              # pause between steps

steps:
  - id: 1
    title: memory note
    shows: System 1 labels a statement about the home; it is kept word for word as a note
    lines: ["my keys are usually on the kitchen counter"]
    max_s: 60
    pass: {rule: note_saved}
    pass_text: a note_saved row

  - id: 2
    title: navigate + question mid-walk
    shows: navigation (A* + SONIC walk), and a question answered while the walk goes on
    lines: ["go to the bedroom dresser", "@6 where are you going?"]
    max_s: 150
    pass: {rule: answered_while_walking, location: dresser, line: 2}
    pass_text: navigate to the dresser succeeded, and speech that started after the question and before arrival

  - id: 3
    title: stop / resume while walking
    shows: halt mid-walk (body halted first, then the ack), resume, and the planner picks the task up again
    lines: ["go to the dining table", "@6 stop", "@5 okay, carry on"]
    max_s: 180
    pass: {rule: stop_resume, location: dining_table}
    pass_text: a stop row, a resume row, then navigate to a dining table succeeded

  - id: 4
    title: recall a note
    shows: recall of the note from step 1
    lines: ["where are my keys?"]
    max_s: 60
    pass: {rule: said, pattern: counter}
    pass_text: speech naming the counter

  - id: 5
    title: spatial memory
    shows: spatial memory built by the looks during the walks (vase_1 on the dresser, vase_2 on the kitchen counter)
    lines: ["where is the vase?"]
    max_s: 60
    pass: {rule: said, pattern: "dresser|counter"}
    pass_text: speech naming the dresser or the counter

  - id: 6
    title: correction mid-walk
    shows: a correction replaces the running task
    lines: ["go to the living room", "@5 no, go to the kitchen counter instead"]
    max_s: 150
    pass: {rule: nav_after_line, location: kitchen_counter, line: 2}
    pass_text: navigate to a kitchen counter succeeded after the correction

  - id: 7
    title: honest refusal (reach)
    shows: "honest refusal: it walks to the table and checks; bowl_1 is beyond the arm's reach from every place it can stand"
    # "can you reach the bowl?" was answered from belief with no check ("cannot reach it from here"); a request
    # makes the planner walk there and check_reachability, which answers beyond_reach with the distances
    lines: ["pick up the bowl"]
    max_s: 150
    pass: {rule: reach_refusal, verdict: beyond_reach}
    pass_text: a check_reachability result with beyond_reach, then speech

  - id: 8
    title: pick (GR00T -> script)
    shows: "reach stance, then manipulate: GR00T arms (experimental) first, the SONIC arm script as the labelled fallback"
    lines: ["pick up the white bottle"]
    if_asked: [["which (one|bottle|of)", "the white one"]]
    needs: empty hands
    max_s: 330
    pass: {rule: pick_holding}
    pass_text: a pick result succeeded with holding true

  - id: 9
    title: question + chitchat
    shows: a state question and chitchat
    lines: ["what are you holding?", "thanks"]
    max_s: 60
    pass: {rule: said, pattern: bottle}
    pass_text: speech naming the bottle
