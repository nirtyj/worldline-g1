# The FIXED pickupable vocabulary (PLAN §1.3 #10, §6.4 "@vocab:pickupable").
#
# AI2-THOR pickupable object types in THOR snake_case (the same names Worldline's belief, memory and eval use).
# The fallback skills' object_types expand this list; it is NEVER derived from the scene catalog, so the tool enum
# does not reveal which types exist in a house (the `missing_object` eval asks for a banana that is not there).
#
# world/ also uses it to decide which scene items are "objects" (pickupable, named <type>_<n>) as opposed to
# landmarks or furniture (THOR's `pickupable` flag; MolmoSpaces has no such flag, only is_static).
version: 1
types:
  - alarm_clock
  - aluminum_foil
  - apple
  - banana            # not an AI2-THOR type; kept so "bring me the banana" is a valid call that ends in "not found"
