# full: SONIC walking + GR00T arms (groot_arms: the off-the-shelf Arena N1.7 G1 checkpoint's arm + Dex3 joint chunks
# through the body `arm` op; label experimental, a house grasp is not expected zero-shot, PLAN §0.8), with the
# labelled fallbacks behind it (policy groot_then_script, PLAN §6.4; every attempt in data.attempts): sonic_arm_script
# (STEPPING STONE: the body's B.7 arm script + a P1 attach), then kinematic_attach (STEPPING STONE, no arm motion).
# World, body, camera and scan as `sonic`.
profile: full
world: isaac
body: sonic
perception_camera: head_sim       # as sonic: P1.4 head camera (an M1 P1 falls back to its d435 model, labelled)
scan_executor: waist              # as sonic (B.5 body `scan` op)
manipulation:
  executors: [groot_arms, sonic_arm_script, kinematic_attach]
  policy: groot_then_script
nav_executor: sonic_walk
frames: isaac
groot_arms:                       # services/executors/groot_arms.py GrootArmsConfig (unset keys keep its defaults)
  endpoint: tcp://127.0.0.1:5550  # P4 PolicyServer; on the main box a local SSH tunnel to the dev box (OD3).
                                  # WL_GROOT_ENDPOINT overrides it
  timeout_s: 1.5                  # one get_action; 2 consecutive errors -> failed(policy_unavailable)
  camera: ego_view                # OD1: Arena's G1 head camera on P1 PUB 5566, rendered only while a session holds it
  camera_port: 5566
  debug_port: 5557                # SONIC g1_debug
  lead_s: 0.15                    # play chunk rows this far ahead: SONIC's ~0.15 s arm lag (G0, docs/arm_tracking.md
                                  # on the body branch); the body's own chunk-mode default. 0 vs 0.15 is the G2 A/B
  # Render budget (SONIC's timing gate with the client active, docs/groot_serving.md §9): P1 renders every enabled
  # camera product at every render call, so during a session the head camera drops to the inference rate and
  # ego_view streams at it too: one render of both per get_action; the client waits for each fresh frame.
  camera_hz: 2.5                  # ego_view rate while the session holds it (p1_m2b.md §5.4: hz persists across off/on)
  camera_warm_hz: 10              # until the first frame (P1 skips 4 warm-up frames per enable: 0.4 s at 10 Hz)
  session_head_hz: 2.5            # the head camera's rate during a session, restored after it (stack default 30)
  frame_sync: true                # wait for the next frame instead of polling a 2.5 Hz stream
  replan_s: 0.4                   # one get_action per frame (2.5 Hz)
