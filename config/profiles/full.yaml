# full: SONIC walking + GR00T arms (groot_arms: the off-the-shelf Arena N1.7 G1 checkpoint's arm + Dex3 joint chunks
# through the body `arm` op; label experimental, a house grasp is not expected zero-shot, PLAN §0.8), with the
# labelled fallbacks behind it (policy groot_then_script, PLAN §6.4; every attempt in data.attempts): sonic_arm_script
# (unhealthy until the body's arm script, B.7), then kinematic_attach (STEPPING STONE, P1 attach/detach).
# World, body, camera and scan as `sonic`.
profile: full
world: isaac
body: sonic
perception_camera: ego_d435       # as sonic (head_sim once P1 renders the head camera, M2b)
scan_executor: turn_in_place      # as sonic (INTERIM)
manipulation:
  executors: [groot_arms, sonic_arm_script, kinematic_attach]
  policy: groot_then_script
nav_executor: sonic_walk
frames: isaac
groot_arms:                       # services/executors/groot_arms.py GrootArmsConfig (unset keys keep its defaults)
  endpoint: tcp://127.0.0.1:5550  # P4 PolicyServer; on the main box a local SSH tunnel to the dev box (OD3).
                                  # WL_GROOT_ENDPOINT overrides it
  timeout_s: 1.5                  # one get_action; 2 consecutive errors -> failed(policy_unavailable)
  camera: ego_view                # OD1: Arena's G1 head camera on P1 PUB 5566, rendered only while a session holds it
  camera_port: 5566
  debug_port: 5557                # SONIC g1_debug
  lead_s: 0.0                     # play chunk rows this far ahead (the G2 A/B against SONIC's ~0.15 s arm lag)
